name: Publier la version
on:
  push:
    branches: ['publication-*']
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les fichiers, créer la version en préversion, ou la rendre publique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#publication-}"
          sha256sum -c SHA256SUMS.txt
          if [ -f PUBLIER ]; then
            # deuxième temps : la préversion, essayée par Dan, devient la dernière version
            gh release edit "v$v" --prerelease=false --latest --notes-file NOTES.md
          else
            # premier temps : préversion (les installateurs en circulation ne la voient pas)
            gh release create "v$v" --prerelease --target main --title "Azeroth_FR $v" --notes-file NOTES.md \
              "Azeroth_FR-Installateur-$v.exe" "Azeroth_FR-Installateur-$v-linux" "Azeroth_FR-$v.zip" SHA256SUMS.txt
          fi
