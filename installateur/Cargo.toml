[package]
name = "azeroth_fr_installateur"
version = "0.9.6"
edition = "2021"
description = "Installateur d'Azeroth_FR, la traduction française de Conquest of Azeroth Core"
authors = ["Dan (LePetitDan)", "Claude"]
publish = false

[[bin]]
name = "Azeroth_FR-Installateur"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
png = "0.17"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[target.'cfg(unix)'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
